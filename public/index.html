<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Finder</title>
<!-- Styling is step 5. This is only enough to see the flow. -->
<style>
/* 1996, with the reading left alone.
 *
 * The chrome is period: teal desktop, a silver window with a navy title bar,
 * raised and sunken bevels done the old way with four border colours, Times
 * New Roman, blue underlined accents, a monospace status bar.
 *
 * The prose is not period. Ninety-nine percent of 1996 pages set text edge to
 * edge at 1.2 leading and they were miserable to read. This is a reading
 * comprehension product, so the measure, the serif and the leading stay: a
 * bored twelve year old has to want to finish the first paragraph.
 *
 * Times New Roman happens to be both the 90s default and a perfectly good
 * reading serif, so nothing had to be traded there.
 */

:root {
  --desktop:  #008080;   /* the teal everyone remembers */
  --chrome:   #c0c0c0;
  --titlebar: #000080;
  --page:     #fffff8;
  --ink:      #000000;
  --quiet:    #555555;
  --link:     #0000ee;
  --rule:     #808080;
  --measure:  34em;      /* ~65 characters. Non-negotiable. */
}

@media (prefers-color-scheme: dark) {
  /* Not a thing in 1996. Included anyway: a page this bright in a dark room
     is unreadable, and unreadable loses to authentic. */
  :root {
    --desktop:  #003b3b;
    --chrome:   #4a4a4a;
    --titlebar: #12123d;
    --page:     #16150f;
    --ink:      #ece7d6;
    --quiet:    #9e988a;
    --link:     #9db8ff;
    --rule:     #2a2a2a;
  }
}

* { box-sizing: border-box; }

html { background: var(--desktop); }

body {
  margin: 0;
  padding: 1.5rem 1rem 3rem;
  background: var(--desktop);
  color: var(--ink);
  font: 400 1.125rem/1.6 "Times New Roman", Times, Georgia, serif;
}

/* --- the window ---------------------------------------------------------- */

#window {
  max-width: var(--measure);
  margin: 0 auto;
  background: var(--chrome);
  padding: 3px;
  /* raised, the 1995 way */
  border: 2px solid;
  border-color: #fff var(--rule) var(--rule) #fff;
}

#titlebar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  background: var(--titlebar);
  color: #fff;
  padding: .25rem .45rem;
  font: 700 .8125rem/1.3 "Courier New", Courier, monospace;
  letter-spacing: .02em;
}
#titlebar .buttons { font-weight: 400; opacity: .9; letter-spacing: -.05em; }

#page {
  background: var(--page);
  padding: 1.5rem 1.4rem 1.75rem;
  /* sunken */
  border: 2px solid;
  border-color: var(--rule) #fff #fff var(--rule);
}

/* --- the goal line ------------------------------------------------------- */

header { margin: 0 0 1.4rem; }
#goal-role {
  margin: 0 0 .4rem;
  color: var(--quiet);
  font: .8125rem/1.4 "Courier New", Courier, monospace;
}
#goal-tonight {
  margin: 0;
  padding: .5rem .65rem;
  background: var(--chrome);
  border: 2px solid;
  border-color: #fff var(--rule) var(--rule) #fff;
  color: var(--ink);
  font-weight: 700;
  font-size: .9375rem;
}

/* --- the story ----------------------------------------------------------- */

main { border-top: 2px groove var(--rule); padding-top: 1.4rem; }
main p { margin: 0 0 1.1rem; }
main p.ask { margin-top: 1.5rem; font-weight: 700; }

main p.chose,
main p.said { margin-left: 1.25rem; color: var(--quiet); font-size: .95rem; }
main p.chose {
  margin-bottom: .3rem;
  font-family: "Courier New", Courier, monospace;
  font-size: .8125rem;
}
main p.said { font-style: italic; margin-bottom: 1.5rem; }

/* Still deliberately unstyled. It is story, not a response. No box, no
   bevel, no colour — the 90s temptation to put it in a table cell with a
   background is exactly the mistake. */
main p.narration { }

main p.ending { margin-top: 1.8rem; padding-top: 1.4rem; border-top: 2px groove var(--rule); }

/* --- choosing ------------------------------------------------------------ */

#controls { margin-top: 1.6rem; }

#options button,
#send {
  font: 400 1rem/1.3 "Times New Roman", Times, Georgia, serif;
  background: var(--chrome);
  color: var(--ink);
  border: 2px solid;
  border-color: #fff var(--rule) var(--rule) #fff;
  cursor: pointer;
}
#options button {
  display: block;
  width: 100%;
  margin: 0 0 .5rem;
  padding: .55rem .8rem;
  text-align: left;
}
#options button:hover { text-decoration: underline; color: var(--link); }
#options button:active,
#send:active { border-color: var(--rule) #fff #fff var(--rule); }

/* --- Nel asking --------------------------------------------------------- */

#nel-stage { margin: 0 0 .35rem; color: var(--quiet); font-size: .95rem; }
#nel-question { margin: 0 0 .8rem; font-weight: 700; }

#reason {
  width: 100%;
  padding: .5rem .6rem;
  background: var(--page);
  color: var(--ink);
  font: 400 1.0625rem/1.4 "Times New Roman", Times, Georgia, serif;
  border: 2px solid;
  border-color: var(--rule) #fff #fff var(--rule);   /* sunken field */
}
#reason::placeholder { color: var(--quiet); font-style: italic; }
#reason:focus { outline: 1px dotted var(--ink); outline-offset: 2px; }
#reason:disabled { background: var(--chrome); }

#send { margin-top: .65rem; padding: .45rem 1.2rem; }
#send:disabled { color: var(--quiet); cursor: default; }

/* --- the status bar ----------------------------------------------------- */

#pending {
  margin: 0;
  padding: .4rem .6rem;
  background: var(--chrome);
  border: 2px solid;
  border-color: var(--rule) #fff #fff var(--rule);
  color: var(--ink);
  font: .8125rem/1.4 "Courier New", Courier, monospace;
}
#pending::after { content: "_"; }

#statusbar {
  margin: 3px 0 0;
  padding: .3rem .5rem;
  background: var(--chrome);
  border: 2px solid;
  border-color: var(--rule) #fff #fff var(--rule);
  color: var(--quiet);
  font: .75rem/1.4 "Courier New", Courier, monospace;
  display: flex;
  justify-content: space-between;
  gap: .75rem;
}

[hidden] { display: none !important; }

@media (max-width: 32em) {
  body { padding: .75rem .5rem 2rem; }
  #page { padding: 1.1rem 1rem 1.3rem; }
  #titlebar { font-size: .75rem; }
  #statusbar { flex-direction: column; gap: .1rem; }
}
</style>
</head>
<body>

<div id="window">
  <div id="titlebar">
    <span>The Finder &ndash; a Greyford job</span>
    <span class="buttons" aria-hidden="true">_ &#9723; &#10005;</span>
  </div>
  <div id="page">

<!-- The role and the clock. Always visible: without it there is no reason to
     investigate anything. -->
<header>
  <p id="goal-role"></p>
  <p id="goal-tonight" class="ask"></p>
</header>

<!-- Everything that has happened, appended. The player can always re-read the
     scene they are being asked about. -->
<main id="story" aria-live="polite"></main>

<!-- One of three states: choose an action, answer Nel, or waiting. -->
<section id="controls">
  <div id="options" hidden></div>

  <form id="why" hidden>
    <p id="nel-stage"></p>
    <p id="nel-question" class="ask"></p>
    <input id="reason" type="text" autocomplete="off" enterkeyhint="send">
    <button type="submit" id="send">Tell her</button>
  </form>

  <p id="pending" class="pending" hidden></p>
</section>

  </div><!-- /#page -->
  <p id="statusbar">
    <span>Document: Done</span>
    <span>Best viewed with your own eyes</span>
  </p>
</div><!-- /#window -->

<script src="scenes.js"></script>
<script>
"use strict";

/* The bucket decides which scene comes next and is never shown to the player.
 * There is no score anywhere in this file, on purpose. */

var ENDPOINT = "/.netlify/functions/turn";

/* If our own function is unreachable the player still gets a sentence, never
 * an error. Same text the function uses for its own failures, so an outage
 * reads as a shrug rather than a bug. */
var OFFLINE_NARRATION =
  "Nel looks at you for a moment, then back at Dorin. The fire settles. " +
  "Outside, the rain still has not started.";

var el = function (id) { return document.getElementById(id); };

var state = {
  sceneId: FIRST_SCENE,
  chosen: null,
  inFlight: false
};

/* ---------------------------------------------------------------- rendering */

function para(text, cls) {
  var p = document.createElement("p");
  if (cls) p.className = cls;
  p.textContent = text;
  el("story").appendChild(p);
  return p;
}

/* The last paragraph of a scene is its closing question — the forced choice.
 * It gets the emphasis so the player knows they are being asked. */
function renderScene(scene) {
  var parts = scene.scene_text.split("\n\n");
  parts.forEach(function (t, i) {
    para(t, i === parts.length - 1 ? "ask" : null);
  });
}

function renderOptions(scene) {
  var box = el("options");
  box.textContent = "";
  scene.options.forEach(function (label) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", function () { chooseOption(label); });
    box.appendChild(b);
  });
  show("options");
}

/* Exactly one of the three control states is ever visible. */
function show(which) {
  ["options", "why", "pending"].forEach(function (id) {
    el(id).hidden = (id !== which);
  });
}

function hideControls() {
  ["options", "why", "pending"].forEach(function (id) { el(id).hidden = true; });
}

/* ------------------------------------------------------------------- the loop */

function chooseOption(label) {
  state.chosen = label;
  /* Their action becomes part of the story they can re-read. */
  para("You: " + label, "chose");
  el("nel-stage").textContent = NEL_PROMPT.stage;
  el("nel-question").textContent = "“" + NEL_PROMPT.question + "”";
  el("reason").placeholder = NEL_PROMPT.placeholder;
  el("reason").value = "";
  show("why");
  el("reason").focus();
}

el("why").addEventListener("submit", function (ev) {
  ev.preventDefault();
  if (state.inFlight) return;
  submitReason(el("reason").value);
});

async function submitReason(reason) {
  state.inFlight = true;
  /* Disable the input, do not remove it — a half-typed sentence vanishing is
     worse than a wait. */
  el("reason").disabled = true;
  el("send").disabled = true;
  /* Their own words belong in the story too. Without this the log shows the
     button they pressed and nothing they wrote, so they cannot re-read their
     reasoning — and the reasoning is the whole point. */
  var said = reason.trim();
  para(said ? "\u201c" + said + "\u201d" : "\u2014", "said");

  el("pending").textContent = "Nel waits.";
  show("pending");

  var out;
  try {
    var res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        scene_id: state.sceneId,
        chosen_option: state.chosen,
        player_reason: reason
      })
    });
    out = await res.json();
  } catch (err) {
    out = null;   /* the network, not the player's problem */
  }

  var bucket = (out && out.bucket) || "GENERIC";
  var narration = (out && out.narration) || OFFLINE_NARRATION;

  el("reason").disabled = false;
  el("send").disabled = false;
  state.inFlight = false;

  advance(bucket, narration);
}

function advance(bucket, narration) {
  para(narration, "narration");

  var scene = SCENES[state.sceneId];

  /* Beat 2 ends the encounter. */
  if (scene.beat === 2) {
    if (scene.ending) para(scene.ending, "ending");
    hideControls();
    el("reason").blur();
    return;
  }

  /* Beat 1 branches on the bucket. The player is never told which. */
  var nextId = scene.next[bucket] || scene.next.GENERIC;
  var next = SCENES[nextId];
  if (!next) { hideControls(); return; }

  state.sceneId = nextId;
  state.chosen = null;
  renderScene(next);
  renderOptions(next);
}

/* ------------------------------------------------------------------- start */

el("goal-role").textContent = GOAL.role;
el("goal-tonight").textContent = GOAL.tonight;

var first = SCENES[state.sceneId];
renderScene(first);
renderOptions(first);
</script>
</body>
</html>
