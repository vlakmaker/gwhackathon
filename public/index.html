<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Finder</title>
<!-- Styling is step 5. This is only enough to see the flow. -->
<style>
/* Step 5: readable, and nothing else.
 *
 * Serif, roughly a 65 character measure, generous leading. A twelve year old
 * has to want to finish the first paragraph, and nothing here may compete with
 * the prose for attention.
 *
 * One rule drives the rest: the narration must read as story, not as feedback.
 * No box, no border, no icon, no colour that says "response". It is set
 * exactly like the scene text, because it is the same story. What separates
 * the turns is the player's own voice, and that is set quieter than the story
 * rather than louder.
 */

:root {
  --paper:  #fdfcfa;
  --ink:    #221f1c;
  --quiet:  #6b655d;   /* the player's own lines, and the waiting state */
  --rule:   #e0dbd2;
  --accent: #7a3b2e;   /* the clock, and nothing else */
  --measure: 34em;     /* ~65 characters at this size */
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:  #1b1a18;
    --ink:    #e9e5de;
    --quiet:  #9b948a;
    --rule:   #35322e;
    --accent: #d9937f;
  }
}

html { background: var(--paper); }

body {
  margin: 0 auto;
  padding: 3rem 1.25rem 6rem;
  max-width: var(--measure);
  background: var(--paper);
  color: var(--ink);
  font: 400 1.1875rem/1.65 "Iowan Old Style", "Palatino Linotype", Palatino,
        "Book Antiqua", Georgia, "Times New Roman", serif;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

/* --- the goal line: role, then the clock. Always visible. --------------- */

header {
  margin-bottom: 2.5rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--rule);
}
#goal-role    { margin: 0 0 .35rem; color: var(--quiet); font-size: .95rem; }
#goal-tonight { margin: 0; color: var(--accent); font-weight: 600; font-size: 1rem; }

/* --- the story ---------------------------------------------------------- */

main p { margin: 0 0 1.15rem; }

/* The closing question. The scene stops here and they must act. */
main p.ask {
  margin-top: 1.6rem;
  font-weight: 600;
}

/* The player's own voice: the action they took, then what they told Nel.
   Quieter than the story, and indented, so the prose stays the loudest thing
   on the page. */
main p.chose,
main p.said {
  margin-left: 1.25rem;
  color: var(--quiet);
  font-size: .98rem;
}
main p.chose { margin-bottom: .3rem; }
main p.said  { font-style: italic; margin-bottom: 1.6rem; }

/* Deliberately not styled. It is story. */
main p.narration { }

/* The ending gets air and a rule, because it is the end. */
main p.ending {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule);
}

/* --- choosing ----------------------------------------------------------- */

#controls { margin-top: 2rem; }

#options button {
  display: block;
  width: 100%;
  margin: 0 0 .6rem;
  padding: .7rem .95rem;
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 1.0625rem;
  text-align: left;
  cursor: pointer;
}
#options button:hover  { border-color: var(--ink); }
#options button:active { transform: translateY(1px); }

/* --- Nel asking --------------------------------------------------------- */

#nel-stage    { margin: 0 0 .35rem; color: var(--quiet); font-size: .98rem; }
#nel-question { margin: 0 0 .9rem; font-weight: 600; }

#reason {
  width: 100%;
  box-sizing: border-box;
  padding: .7rem .95rem;
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  font-size: 1.0625rem;
}
#reason::placeholder { color: var(--quiet); font-style: italic; }
#reason:focus        { outline: 2px solid var(--accent); outline-offset: 1px; }
#reason:disabled     { opacity: .55; }

#send {
  margin-top: .7rem;
  padding: .6rem 1.1rem;
  border: 1px solid var(--ink);
  border-radius: 2px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 1rem;
  cursor: pointer;
}
#send:disabled { opacity: .45; cursor: default; }

/* Waiting. Quiet on purpose — a spinner would make this feel like marking. */
#pending {
  margin: 0;
  color: var(--quiet);
  font-style: italic;
}

[hidden] { display: none !important; }

@media (max-width: 32em) {
  body { padding: 2rem 1.1rem 4rem; font-size: 1.125rem; }
}

@media (prefers-reduced-motion: reduce) {
  #options button:active { transform: none; }
}
</style>
</head>
<body>

<!-- The role and the clock. Always visible: without it there is no reason to
     investigate anything. -->
<header>
  <p id="goal-role"></p>
  <p id="goal-tonight" class="ask"></p>
</header>

<!-- Everything that has happened, appended. The player can always re-read the
     scene they are being asked about. -->
<main id="story" aria-live="polite"></main>

<!-- One of three states: choose an action, answer Nel, or waiting. -->
<section id="controls">
  <div id="options" hidden></div>

  <form id="why" hidden>
    <p id="nel-stage"></p>
    <p id="nel-question" class="ask"></p>
    <input id="reason" type="text" autocomplete="off" enterkeyhint="send">
    <button type="submit" id="send">Tell her</button>
  </form>

  <p id="pending" class="pending" hidden></p>
</section>

<script src="scenes.js"></script>
<script>
"use strict";

/* The bucket decides which scene comes next and is never shown to the player.
 * There is no score anywhere in this file, on purpose. */

var ENDPOINT = "/.netlify/functions/turn";

/* If our own function is unreachable the player still gets a sentence, never
 * an error. Same text the function uses for its own failures, so an outage
 * reads as a shrug rather than a bug. */
var OFFLINE_NARRATION =
  "Nel looks at you for a moment, then back at Dorin. The fire settles. " +
  "Outside, the rain still has not started.";

var el = function (id) { return document.getElementById(id); };

var state = {
  sceneId: FIRST_SCENE,
  chosen: null,
  inFlight: false
};

/* ---------------------------------------------------------------- rendering */

function para(text, cls) {
  var p = document.createElement("p");
  if (cls) p.className = cls;
  p.textContent = text;
  el("story").appendChild(p);
  return p;
}

/* The last paragraph of a scene is its closing question — the forced choice.
 * It gets the emphasis so the player knows they are being asked. */
function renderScene(scene) {
  var parts = scene.scene_text.split("\n\n");
  parts.forEach(function (t, i) {
    para(t, i === parts.length - 1 ? "ask" : null);
  });
}

function renderOptions(scene) {
  var box = el("options");
  box.textContent = "";
  scene.options.forEach(function (label) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", function () { chooseOption(label); });
    box.appendChild(b);
  });
  show("options");
}

/* Exactly one of the three control states is ever visible. */
function show(which) {
  ["options", "why", "pending"].forEach(function (id) {
    el(id).hidden = (id !== which);
  });
}

function hideControls() {
  ["options", "why", "pending"].forEach(function (id) { el(id).hidden = true; });
}

/* ------------------------------------------------------------------- the loop */

function chooseOption(label) {
  state.chosen = label;
  /* Their action becomes part of the story they can re-read. */
  para("You: " + label, "chose");
  el("nel-stage").textContent = NEL_PROMPT.stage;
  el("nel-question").textContent = "“" + NEL_PROMPT.question + "”";
  el("reason").placeholder = NEL_PROMPT.placeholder;
  el("reason").value = "";
  show("why");
  el("reason").focus();
}

el("why").addEventListener("submit", function (ev) {
  ev.preventDefault();
  if (state.inFlight) return;
  submitReason(el("reason").value);
});

async function submitReason(reason) {
  state.inFlight = true;
  /* Disable the input, do not remove it — a half-typed sentence vanishing is
     worse than a wait. */
  el("reason").disabled = true;
  el("send").disabled = true;
  /* Their own words belong in the story too. Without this the log shows the
     button they pressed and nothing they wrote, so they cannot re-read their
     reasoning — and the reasoning is the whole point. */
  var said = reason.trim();
  para(said ? "\u201c" + said + "\u201d" : "\u2014", "said");

  el("pending").textContent = "Nel waits.";
  show("pending");

  var out;
  try {
    var res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        scene_id: state.sceneId,
        chosen_option: state.chosen,
        player_reason: reason
      })
    });
    out = await res.json();
  } catch (err) {
    out = null;   /* the network, not the player's problem */
  }

  var bucket = (out && out.bucket) || "GENERIC";
  var narration = (out && out.narration) || OFFLINE_NARRATION;

  el("reason").disabled = false;
  el("send").disabled = false;
  state.inFlight = false;

  advance(bucket, narration);
}

function advance(bucket, narration) {
  para(narration, "narration");

  var scene = SCENES[state.sceneId];

  /* Beat 2 ends the encounter. */
  if (scene.beat === 2) {
    if (scene.ending) para(scene.ending, "ending");
    hideControls();
    el("reason").blur();
    return;
  }

  /* Beat 1 branches on the bucket. The player is never told which. */
  var nextId = scene.next[bucket] || scene.next.GENERIC;
  var next = SCENES[nextId];
  if (!next) { hideControls(); return; }

  state.sceneId = nextId;
  state.chosen = null;
  renderScene(next);
  renderOptions(next);
}

/* ------------------------------------------------------------------- start */

el("goal-role").textContent = GOAL.role;
el("goal-tonight").textContent = GOAL.tonight;

var first = SCENES[state.sceneId];
renderScene(first);
renderOptions(first);
</script>
</body>
</html>
